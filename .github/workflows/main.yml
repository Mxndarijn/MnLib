name: Auto release mn-angular-lib on main

on:
  push:
    branches: [ main ]
    # projects/mn-angular-lib/README.md zit in het npm-pakket en wordt daarom bewust niet genegeerd
    paths-ignore:
      - 'README.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - '**/USAGE.md'
      - '.github/pull_request_template.md'
      - '.github/CODEOWNERS'
      - '.github/dependabot.yml'

permissions:
  id-token: write  # Required for OIDC
  contents: read

# Nooit een lopende release afbreken
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true   # zorg dat GITHUB_TOKEN in git remote zit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'  # npm 11 voor OIDC trusted publishing
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install deps (root)
        run: npm ci

      - name: Lint mn-angular-lib
        run: npx ng lint mn-angular-lib

      - name: Run tests (lib only, CI mode)
        run: npx ng test mn-angular-lib --watch=false --browsers=ChromeHeadless --progress=false
        env:
          CI: "true"

      - name: Configure git user
        run: |
          git config user.name "ci-release-bot"
          git config user.email "ci@example.com"
          # optioneel: voor monorepos/containers
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

            # ---- Versie bump (zonder auto-commit/tag) ----
      - name: Bump version (patch) in projects/mn-angular-lib
        working-directory: projects/mn-angular-lib
        run: |
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      # Build ná de bump (versie zit in de dist), maar vóór commit/tag/push:
      # een falende build maakt zo nooit een tag aan
      - name: Build mn-angular-lib
        run: npx ng build mn-angular-lib --configuration production

      # OIDC trusted publishing vereist npm >= 11.5.1
      - name: Ensure npm supports trusted publishing
        run: |
          NPM_VERSION=$(npm --version)
          echo "npm $NPM_VERSION"
          if [ "$(printf '%s\n' 11.5.1 "$NPM_VERSION" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm $NPM_VERSION is too old for trusted publishing (need >= 11.5.1)"
            exit 1
          fi

      # Pakketproblemen vóór de push vangen. De echte publish blijft ná de push:
      # eerst publiceren kan een versie uitbrengen die nooit op main landt als de push faalt
      - name: Publish dry-run
        working-directory: dist/mn-angular-lib
        run: npm publish --dry-run --access public

      # ---- Commit + tag aanmaken en pushen ----
      - name: Commit version bump and create tag
        run: |
          git add projects/mn-angular-lib/package.json projects/mn-angular-lib/package-lock.json
          git commit -m "chore(release): v${NEW_VERSION} [skip ci]"
          git tag "v${NEW_VERSION}"
          git push origin HEAD:main
          git push origin --tags

      - name: Publish dist/mn-angular-lib to npm
        working-directory: dist/mn-angular-lib
        run: npm publish --access public
