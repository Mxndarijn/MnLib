name: PR checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      lib: ${{ steps.f.outputs.lib }}
    steps:
      # No checkout: pull_request-only, so paths-filter lists changed files via the API
      # (pull-requests: read). Restore actions/checkout if push/merge_group is ever added.
      - id: f
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          # Docs-only ignore list instead of an allowlist, so a new root config file (e.g.
          # .postcssrc.json) fails safe. 'every' is required for the negations to exclude:
          # a file counts only if it matches '**' and none of the '!' patterns.
          # The lib README ships in the npm package but is only copied by ng-packagr, so no
          # check can fail on it; main.yml still releases on it.
          predicate-quantifier: 'every'
          filters: |
            lib:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE*'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/CODEOWNERS'
              - '!.github/dependabot.yml'
              - '!.vscode/**'
              - '!.claude/**'

  lint:
    name: Lint (eslint + i18n)
    needs: changes
    if: needs.changes.outputs.lib == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run lint

  type-check:
    name: Type-check (lib + specs)
    needs: changes
    if: needs.changes.outputs.lib == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24', cache: npm }
      - run: npm ci
      # The spec tsconfig covers every entry's sources plus the specs; tsconfig.lib.json only
      # works under ng-packagr (empty paths, inlineSources), which the build job checks.
      - run: npx tsc --noEmit -p projects/mn-angular-lib/tsconfig.spec.json

  test:
    name: Tests (coverage gate)
    needs: changes
    if: needs.changes.outputs.lib == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24', cache: npm }
      - run: npm ci
      # Thresholds live in karma.conf.js (coverageReporter.check).
      - run: npx ng test mn-angular-lib --watch=false --browsers=ChromeHeadless --progress=false --code-coverage
        env: { CI: "true" }

  build:
    name: Build + pack dry-run
    needs: changes
    if: needs.changes.outputs.lib == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npx ng build mn-angular-lib --configuration production
      - name: Pack dry-run (catches broken package exports)
        working-directory: dist/mn-angular-lib
        run: npm pack --dry-run

  # Single stable required check; passes when the jobs were skipped because the PR only touched
  # docs/editor files (see the changes filter).
  pr-gate:
    name: pr-gate
    if: always()
    needs: [changes, lint, type-check, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then exit 1; fi
