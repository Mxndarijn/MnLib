name: PR checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pr-gate:
    name: pr-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npx ng test mn-angular-lib --watch=false --browsers=ChromeHeadless --progress=false
        env: { CI: "true" }
      - run: npx ng build mn-angular-lib --configuration production
      - name: Pack dry-run (catches broken package exports)
        working-directory: dist/mn-angular-lib
        run: npm pack --dry-run
