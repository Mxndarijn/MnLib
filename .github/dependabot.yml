version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ['*'] } }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      angular: { patterns: ['@angular/*', '@angular-devkit/*', '@angular-eslint/*', 'angular-eslint', 'ng-packagr', 'typescript', 'typescript-eslint', '@typescript-eslint/*', 'zone.js'] }
      minor-patch: { update-types: [minor, patch] }
