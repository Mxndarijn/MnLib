<div class="relative mb-10">
  <!--
    Scroll chevrons, one per edge that hides tabs. They sit in the 2rem strip the edge fade
    dissolves, so they cover nothing still legible. aria-hidden and out of the Tab order: the
    arrow keys already move between tabs (and scroll them into view), and a screen reader reads
    every tab whether scrolled into view or not. mousedown is cancelled so a press does not
    take focus away from the active tab.
  -->
  @if (canScrollStart()) {
    <button
      (click)="scrollTabs(-1)"
      (mousedown)="$event.preventDefault()"
      aria-hidden="true"
      class="absolute inset-y-0 left-0 z-10 flex w-8 cursor-pointer items-center justify-start text-base-content hover:text-primary"
      data-mn-tab-scroll="start"
      tabindex="-1"
      type="button"
    >
      <svg [size]="18" [lucideIcon]="icons.ChevronLeft"></svg>
    </button>
  }
  @if (canScrollEnd()) {
    <button
      (click)="scrollTabs(1)"
      (mousedown)="$event.preventDefault()"
      aria-hidden="true"
      class="absolute inset-y-0 right-0 z-10 flex w-8 cursor-pointer items-center justify-end text-base-content hover:text-primary"
      data-mn-tab-scroll="end"
      tabindex="-1"
      type="button"
    >
      <svg [size]="18" [lucideIcon]="icons.ChevronRight"></svg>
    </button>
  }
  <div
    #scrollContainer
    (scroll)="updateEdgeFades()"
    class="flex justify-start scrollbar-hide"
    [class.overflow-x-auto]="scrollable"
    [class.overflow-y-hidden]="scrollable"
  >
    <div
      #tabList
      role="tablist"
      class="tabs relative flex flex-nowrap -mb-[1px] border-b border-base-300"
      [class.w-full]="justified"
    >
      <!--
        Shared sliding indicator: a single underline that travels to the active
        tab, rather than each tab flipping its own border on/off (which snaps).
        Pinned to left-0/top-auto so offsetLeft maps 1:1 regardless of the
        flex justify-content or the justified full-width layout; position and
        width are measured and set from TS. Sits on the same baseline as the
        hover ::after so hover → select reads as one continuous underline.
      -->
      <div
        #indicator
        aria-hidden="true"
        class="pointer-events-none absolute left-0 top-auto bottom-0 h-[2px] w-0 bg-primary opacity-0 transition-[transform,width] duration-300 ease-out motion-reduce:transition-none"
      ></div>
      @if (isLoadingState) {
        @for (i of skeletonTabs; track i) {
          <div
            [class.flex-1]="justified"
            class="tab px-4 py-2 border-b-2 border-transparent flex items-center justify-center"
          >
            <mn-skeleton [data]="{ shape: 'rectangle', width: '4.5rem', height: '1rem' }"></mn-skeleton>
          </div>
        }
      } @else {
        @for (item of dataSource.items; track item.label) {
          <!-- One Tab stop per bar (the active tab); the arrow keys, Home and End move between
               tabs and activate them, the WAI-ARIA tabs pattern. Every tab used to be its own
               Tab stop with no arrow keys, so crossing an eight-tab bar took eight presses. -->
          <div
            (click)="setActive(item)"
            (keydown)="onTabKeydown($event, item)"
            [attr.aria-selected]="currentActive === item"
            [attr.tabindex]="isTabStop(item) ? 0 : -1"
            [class.hover:after:scale-x-100]="currentActive !== item"
            [class.flex-1]="justified"
            [class.font-bold]="currentActive === item"
            [class.text-base-content]="currentActive !== item"
            [class.text-primary]="currentActive === item"
            class="tab relative px-4 py-2 border-b-2 border-transparent cursor-pointer select-none transition-colors whitespace-nowrap text-center flex items-center gap-2 after:content-[''] after:absolute after:inset-x-0 after:-bottom-[2px] after:h-[2px] after:bg-primary/60 after:origin-center after:scale-x-0 after:transition-transform after:duration-300 after:ease-out"
            role="tab"
          >
            {{ item.label | mnTranslate }}
            @let badge = getBadge(item);
            @if (badge && badge > 0) {
              <span [data]="{ size: 'sm', color: 'accent', variant: 'fill' }" mnBadge>{{ badge }}</span>
            }
          </div>
        }
      }
    </div>
  </div>
</div>
