<div class="flex flex-col gap-6" [ngClass]="toneClass">
  <!-- Custom Content (Component or Template) -->
  @if (config.component || config.template) {
    <mn-custom-body-host
      [config]="$any(config)"
      [modalRef]="$any(modalRef)"
    ></mn-custom-body-host>
  }

  <div class="flex flex-col items-center text-center gap-6">
    @if (config.tone === 'warning' || config.tone === 'danger') {
      <div
        class="w-12 h-12 rounded-full flex items-center justify-center"
        [ngClass]="{
          'bg-blue-100 text-blue-500': config.tone !== 'warning' && config.tone !== 'danger',
          'bg-amber-100 text-amber-500': config.tone === 'warning',
          'bg-red-100 text-red-500': config.tone === 'danger'
        }">
        @if (config.tone === 'warning') {
          <svg [size]="24" lucideTriangleAlert></svg>
        }
        @if (config.tone === 'danger') {
          <svg [size]="24" lucideCircleAlert></svg>
        }
      </div>
    }

    @if (config.message) {
      <div class="text-base text-base-content/80 leading-relaxed max-w-[28rem]">
        {{ config.message }}
      </div>
    }
  </div>

  <!-- Form Fields / Rows -->
  @if (hasFormFields) {
    <mn-form-body
      [config]="$any(config)"
      [modalRef]="$any(modalRef)"
      [hideFooter]="true"
      [hideCustomBody]="true"
      (formStatusChange)="onFormStatusChange($event)"
    ></mn-form-body>
  }

  <div class="flex gap-3 w-full pb-6 sticky bottom-0 bg-base-100 z-10">
    <button
      mnButton
      [data]="{
        variant: getButtonVariant(cancelStyle),
        color: getButtonColor(cancelStyle)
      }"
      (click)="cancel()"
    >
      @if (cancelIcon; as icon) {
        <svg [lucideIcon]="icon" [size]="actionIconSize" class="mr-2"></svg>
      }
      {{ cancelLabel }}
    </button>

    <div class="flex-1"></div>

    <button
      mnButton
      [data]="{
        variant: getButtonVariant(confirmStyle),
        color: getButtonColor(confirmStyle),
        disabled: isConfirmDisabled
      }"
      [disabled]="isConfirmDisabled"
      (click)="confirm()"
    >
      @if (confirmIcon; as icon) {
        <svg [lucideIcon]="icon" [size]="actionIconSize" class="mr-2"></svg>
      }
      {{ confirmLabel }}
    </button>
  </div>
</div>
