<app-demo-page
  title="Multi Select"
  tag="mn-multi-select"
  lead="ControlValueAccessor multi-select with validation, searchable options, max selections, and disabled options."
>
  <div demo-actions style="display: flex; gap: 10px;">
    <button mnButton [data]="{ variant: 'outline', color: 'primary', size: 'sm' }" (click)="form.markAllAsTouched()" type="button">
      Show All Validation Errors
    </button>
    <button mnButton [data]="{ variant: 'text', color: 'gray', size: 'sm' }" (click)="form.reset()" type="button">
      Reset Form
    </button>
  </div>

  <form [formGroup]="form" mn-section="root" style="display: flex; flex-direction: column; gap: 18px;">
    <app-demo-example
      title="Required multi-select with validation"
      hint="A basic multi-select with Validators.required. Shows an error when touched without a selection."
    >
      <mn-lib-multi-select [props]="fruitsProps"
                           class="block w-[300px] max-w-full"
                           formControlName="fruits"
      ></mn-lib-multi-select>
      <p style="margin-top: 8px; font-size: 14px; color: gray;">
        Selected: <strong>{{ selectedFruits }}</strong>
      </p>
    </app-demo-example>

    <app-demo-example
      title="Searchable with max 3 selections"
      hint="Uses searchable: true and maxSelections: 3. Once 3 items are selected, remaining options are disabled."
    >
      <mn-lib-multi-select [props]="colorsProps"
                           class="block w-[300px] max-w-full"
                           formControlName="colors"
      ></mn-lib-multi-select>
      <p style="margin-top: 8px; font-size: 14px; color: gray;">
        Selected: <strong>{{ selectedColors }}</strong>
      </p>
    </app-demo-example>

    <app-demo-example
      title="Disabled options &amp; custom error messages"
      hint="The COBOL option is disabled. Uses custom errorMessages for the required validator."
    >
      <mn-lib-multi-select [props]="languagesProps"
                           class="block w-[300px] max-w-full"
                           formControlName="languages"
      ></mn-lib-multi-select>
      <p style="margin-top: 8px; font-size: 14px; color: gray;">
        Selected: <strong>{{ selectedLanguages }}</strong>
      </p>
    </app-demo-example>
  </form>
</app-demo-page>
