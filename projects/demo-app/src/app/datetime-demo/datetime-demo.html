<app-demo-page
  title="Datetime"
  tag="mn-datetime"
  lead="Date and time picker with datetime-local, date, and time modes, variants, min/max constraints, and validation."
>
  <div demo-actions style="display: flex; gap: 10px;">
    <button mnButton [data]="{ variant: 'outline', color: 'primary', size: 'sm' }" type="button" (click)="form.markAllAsTouched()">
      Show All Validation Errors
    </button>
    <button mnButton [data]="{ variant: 'text', color: 'gray', size: 'sm' }" type="button" (click)="form.reset()">
      Reset Form
    </button>
  </div>

  <form [formGroup]="form" style="display: flex; flex-direction: column; gap: 18px;">
    <app-demo-example
      title="Datetime-local (default mode)"
      hint="Default datetime-local mode with required validation, built-in error messages, and hover styling."
    >
      <mn-lib-datetime
        formControlName="appointment"
        [props]="appointmentProps"
      ></mn-lib-datetime>
    </app-demo-example>

    <app-demo-example
      title="Date-only mode"
      hint="Uses mode: 'date' for date-only input with larger size and border radius."
    >
      <mn-lib-datetime
        formControlName="birthday"
        [props]="birthdayProps"
      ></mn-lib-datetime>
    </app-demo-example>

    <app-demo-example
      title="Time-only mode"
      hint="Uses mode: 'time' with a 15-minute step interval and custom error messages."
    >
      <mn-lib-datetime
        formControlName="meetingTime"
        [props]="meetingTimeProps"
      ></mn-lib-datetime>
    </app-demo-example>

    <app-demo-example
      title="Min/max constraints &amp; full width"
      hint="Datetime-local with min/max constraints, full width, shadow, small size variant, and hover styling."
    >
      <mn-lib-datetime
        formControlName="deadline"
        [props]="deadlineProps"
      ></mn-lib-datetime>
    </app-demo-example>
  </form>
</app-demo-page>
