<app-demo-page
  title="Input Field"
  tag="mn-input-field"
  lead="Reactive-forms text input with flexible error handling and display modes."
>
  <div demo-actions style="display: flex; gap: 10px;">
    <button mnButton [data]="{ variant: 'outline', color: 'primary', size: 'sm' }" type="button" (click)="form.markAllAsTouched()">
      Show All Validation Errors
    </button>
    <button mnButton [data]="{ variant: 'text', color: 'gray', size: 'sm' }" type="button" (click)="form.reset()">
      Reset Form
    </button>
  </div>

  <form [formGroup]="form" mn-section="root" style="display: flex; flex-direction: column; gap: 18px;">
    <app-demo-example
      title="Default built-in error messages"
      hint="Built-in English error messages with hover styling. Label and placeholder come from defaults['mn-input-field']."
    >
      <mn-lib-input-field class="block w-[200px]"
        formControlName="name"
        [props]="nameProps"
      ></mn-lib-input-field>
    </app-demo-example>

    <app-demo-example
      title="Custom error messages &amp; section override"
      hint="useBuiltInErrorMessages: false uses only custom messages. Label and placeholder resolve from the section-a override."
    >
      <div mn-section="section-a">
        <mn-lib-input-field
          formControlName="email"
          [props]="emailProps"
        ></mn-lib-input-field>
      </div>
    </app-demo-example>

    <app-demo-example
      title="Priority-based error display (single error)"
      hint="errorPriority controls which error shows first. Try entering 'x' or fewer than 3 characters."
    >
      <mn-lib-input-field
        formControlName="username"
        [props]="usernameProps"
      ></mn-lib-input-field>
    </app-demo-example>

    <app-demo-example
      title="Show all errors mode"
      hint="showAllErrors: true displays every validation error at once. Try a weak password to see them stack."
    >
      <mn-lib-input-field
        formControlName="password"
        [props]="passwordProps"
      ></mn-lib-input-field>
    </app-demo-example>

    <app-demo-example
      title="Disabled field"
      hint="The FormControl is created with disabled: true; hover effects are suppressed."
    >
      <mn-lib-input-field class="block w-[200px]"
        formControlName="disabledField"
        [props]="disabledProps"
        [disabled]="true"
      ></mn-lib-input-field>
    </app-demo-example>
  </form>
</app-demo-page>
