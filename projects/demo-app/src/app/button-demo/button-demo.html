<app-demo-page
  title="Button"
  tag="[mnButton]"
  lead="Buttons and links across colors, sizes, variants, and states."
>
  <app-demo-example title="Primary">
    <div class="flex flex-row flex-wrap gap-2">
      <button mnButton [data]="{ color: 'primary', size: 'sm', variant: 'fill', borderRadius: 'three_xl' }">
        Small fill
      </button>
      <button mnButton [data]="{ color: 'primary', size: 'md', variant: 'outline' }">
        Outline button
      </button>
      <button mnButton [data]="{ color: 'primary', size: 'lg', variant: 'text' }">
        Text button
      </button>
      <button mnButton [data]="{ color: 'primary', size: 'lg', variant: 'textUnderline' }">
        Text underline button
      </button>
    </div>
  </app-demo-example>
