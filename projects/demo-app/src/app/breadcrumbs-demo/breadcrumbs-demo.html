<app-demo-page
  title="Breadcrumbs"
  tag="mn-breadcrumbs"
  lead="A flexible trail: pass crumbs (each optionally linked) and the last one is the current page. Pass none and it degrades to a single Back control."
>
  <app-demo-example title="Linked trail" hint="Each previous crumb carries an href; the last is the current page.">
    <mn-breadcrumbs [data]="trail" (crumbClick)="onCrumb($event)"></mn-breadcrumbs>
  </app-demo-example>

  <app-demo-example title="Callback-driven trail" hint="Crumbs use onClick/crumbClick for SPA routing (check the console).">
    <mn-breadcrumbs [data]="clickTrail" (crumbClick)="onCrumb($event)"></mn-breadcrumbs>
  </app-demo-example>

  <app-demo-example title="Back fallback — with link" hint="No crumbs, but a backHref and custom label point the way.">
    <mn-breadcrumbs [data]="backWithLink" (back)="onBack()"></mn-breadcrumbs>
  </app-demo-example>

  <app-demo-example title="Back fallback — automatic" hint="No crumbs and no link: the generic back steps through browser history.">
    <mn-breadcrumbs [data]="backAuto" (back)="onBack()"></mn-breadcrumbs>
  </app-demo-example>

  <app-demo-example title="Small size" hint="The same trail at size: 'sm'.">
    <mn-breadcrumbs [data]="{ items: trail.items, size: 'sm' }" (crumbClick)="onCrumb($event)"></mn-breadcrumbs>
  </app-demo-example>
</app-demo-page>
