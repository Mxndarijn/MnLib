<app-demo-page
  title="File Input"
  tag="mn-file-input"
  lead="Accessible ControlValueAccessor file input with image previews and client-side accept, maxSize, and maxFiles limits."
>
  <div demo-actions style="display: flex; gap: 10px;">
    <button mnButton [data]="{ variant: 'outline', color: 'primary', size: 'sm' }" (click)="form.markAllAsTouched()" type="button">
      Show Validation Errors
    </button>
    <button mnButton [data]="{ variant: 'text', color: 'gray', size: 'sm' }" (click)="reset()" type="button">
      Reset Form
    </button>
  </div>

  <form (change)="updateSnapshot()" [formGroup]="form" style="display: flex; flex-direction: column; gap: 18px;">
    <app-demo-example
      title="Dropzone (default), single image, required"
      hint="Default dropzone layout with a required validator and a 2 MB maxSize. Drag a file over it to see the release-to-drop state; pick a non-image or oversized file to see the inline error."
    >
      <div style="max-width: 480px;">
        <mn-lib-file-input
          [props]="avatarProps"
          formControlName="avatar"
        ></mn-lib-file-input>
      </div>
    </app-demo-example>

    <app-demo-example
      title="Thumbnail grid, multiple (max 4)"
      hint="displayMode: 'thumbnail' with multiple: true and maxFiles: 4. Selected images render as tiles with a remove action. Dragging files over the grid covers it with a release-to-drop overlay."
    >
      <div style="max-width: 480px;">
        <mn-lib-file-input
          [props]="galleryProps"
          formControlName="gallery"
        ></mn-lib-file-input>
      </div>
    </app-demo-example>

    <app-demo-example
      title="List mode, documents"
      hint="displayMode: 'list' with accept: '.pdf,.doc,.docx,.txt'. Non-image files show a file icon, name, and size, and the rows accept a drop too."
    >
      <div style="max-width: 480px;">
        <mn-lib-file-input
          [props]="documentsProps"
          formControlName="documents"
        ></mn-lib-file-input>
      </div>
    </app-demo-example>

    <app-demo-example
      title="Compact inline picker"
      hint="displayMode: 'compact' renders an inline button plus the current filename. It is the one mode that does not accept a drop — the button is too small to aim a drag at."
    >
      <div style="max-width: 480px;">
        <mn-lib-file-input
          [props]="attachmentProps"
          formControlName="attachment"
        ></mn-lib-file-input>
      </div>
    </app-demo-example>

    <app-demo-example
      title="Existing image via currentUrl"
      hint="Previews an already-saved image, with a custom dropActiveHint. Removing it emits cleared and leaves the form value untouched (flag a delete on the server)."
    >
      <div style="max-width: 480px;">
        <mn-lib-file-input
          (cleared)="onCoverCleared()"
          [props]="coverProps"
          formControlName="cover"
        ></mn-lib-file-input>
      </div>
    </app-demo-example>
  </form>

  <app-demo-example title="Form value" hint="Live snapshot of the current reactive form value.">
    @if (snapshot()) {
      <pre
        style="padding: 16px; background: var(--color-base-200); border: 1px solid var(--color-base-300); border-radius: var(--mn-radius); overflow: auto; max-width: 480px;">{{ snapshot() }}</pre>
    }
  </app-demo-example>
</app-demo-page>
