<div class="shell" [class.nav-open]="navOpen()">
  <!-- Mobile top bar -->
  <div class="topbar">
    <button class="menu-btn" (click)="navOpen.set(true)" aria-label="Open navigation">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <a routerLink="/demos" class="topbar-brand" (click)="closeNav()">MnLib</a>
    <app-theme-toggle/>
  </div>

  <!-- Backdrop behind the open drawer (mobile) -->
  <div class="backdrop" (click)="closeNav()"></div>

  <aside class="sidebar">
    <div class="sidebar-brand">
      <a class="brand-link" routerLink="/demos" (click)="closeNav()">
        <span class="brand-mark">Mn</span>
        <span class="brand-name">MnLib</span>
      </a>
      <span class="brand-tag">components</span>
    </div>

    <div class="sidebar-search">
      <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        type="search"
        placeholder="Search components…"
        aria-label="Search components"
        [value]="query()"
        (input)="onSearch($event)"
      />
    </div>

    <nav class="sidebar-nav">
      @for (group of filteredGroups(); track group.category) {
        <div class="nav-group">
          <div class="nav-group-label">{{ group.category }}</div>
          @for (item of group.items; track item.path) {
            <a
              class="nav-link"
              [routerLink]="item.path"
              routerLinkActive="active"
              (click)="closeNav()"
            >
              <span class="nav-dot" [style.background]="item.color"></span>
              <span class="nav-text">{{ item.title }}</span>
            </a>
          }
        </div>
      }
      @if (filteredGroups().length === 0) {
        <p class="nav-empty">No components match “{{ query() }}”.</p>
      }
    </nav>

    <div class="sidebar-foot">
      <app-theme-toggle/>
      <span class="foot-meta">{{ total }} components</span>
    </div>
  </aside>

  <main class="content">
    <div class="content-inner">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
