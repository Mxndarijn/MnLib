<app-demo-page
  title="Textarea"
  tag="mn-textarea"
  lead="Multi-line input with configurable rows, resize behavior, and the same error handling as the input field."
>
  <div demo-actions style="display: flex; gap: 10px;">
    <button mnButton [data]="{ variant: 'outline', color: 'primary', size: 'sm' }" type="button" (click)="form.markAllAsTouched()">
      Show All Validation Errors
    </button>
    <button mnButton [data]="{ variant: 'text', color: 'gray', size: 'sm' }" type="button" (click)="form.reset()">
      Reset Form
    </button>
  </div>

  <form [formGroup]="form" mn-section="root" style="display: flex; flex-direction: column; gap: 18px;">
    <app-demo-example
      title="Basic textarea (vertical resize, full width)"
      hint="A required textarea with rows: 4, resize: 'vertical', and fullWidth: true."
    >
      <mn-lib-textarea
        formControlName="description"
        [props]="descriptionProps"
      ></mn-lib-textarea>
    </app-demo-example>

    <app-demo-example
      title="Show all errors &amp; no resize"
      hint="showAllErrors: true with resize: 'none', a shadow, and larger size. Type fewer than 10 characters to see multiple errors."
    >
      <mn-lib-textarea
        formControlName="bio"
        [props]="bioProps"
      ></mn-lib-textarea>
    </app-demo-example>

    <app-demo-example
      title="Priority-based errors &amp; both resize"
      hint="errorPriority controls which error shows first. resize: 'both' allows resizing in both directions."
    >
      <mn-lib-textarea
        formControlName="notes"
        [props]="notesProps"
      ></mn-lib-textarea>
    </app-demo-example>
  </form>
</app-demo-page>
