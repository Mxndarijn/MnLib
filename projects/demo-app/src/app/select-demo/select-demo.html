<app-demo-page
  title="Select"
  tag="mn-select"
  lead="Custom single-value picker: an anchored popover on desktop, the shared bottom sheet on mobile (< 640px). ControlValueAccessor, validation, optional search, and tailwind-variants styling. Resize the window below 640px to see the sheet."
>
  <div demo-actions style="display: flex; gap: 10px;">
    <button mnButton [data]="{ variant: 'outline', color: 'primary', size: 'sm' }" (click)="form.markAllAsTouched()" type="button">
      Show All Validation Errors
    </button>
    <button mnButton [data]="{ variant: 'text', color: 'gray', size: 'sm' }" (click)="form.reset()" type="button">
      Reset Form
    </button>
  </div>

  <form [formGroup]="form" mn-section="root" style="display: flex; flex-direction: column; gap: 18px;">
    <app-demo-example
      title="Required select with validation"
      hint="A basic select with Validators.required. Shows the built-in error when touched without a selection."
    >
      <mn-lib-select [props]="countryProps"
                     class="block w-[300px] max-w-full"
                     formControlName="country"
      ></mn-lib-select>
      <p style="margin-top: 8px; font-size: 14px; color: gray;">
        Selected: <strong>{{ selectedCountry }}</strong>
      </p>
    </app-demo-example>

    <app-demo-example
      title="Disabled options &amp; custom styling"
      hint="Uses size: 'lg' and borderRadius: 'lg'. The XXL option is disabled."
    >
      <mn-lib-select [props]="sizeProps"
                     class="block w-[300px] max-w-full"
                     formControlName="size"
      ></mn-lib-select>
      <p style="margin-top: 8px; font-size: 14px; color: gray;">
        Selected: <strong>{{ selectedSize }}</strong>
      </p>
    </app-demo-example>

    <app-demo-example
      title="Custom error messages"
      hint="Custom errorMessages override the built-in 'Please select an option' message."
    >
      <mn-lib-select [props]="priorityProps"
                     class="block w-[300px] max-w-full"
                     formControlName="priority"
      ></mn-lib-select>
      <p style="margin-top: 8px; font-size: 14px; color: gray;">
        Selected: <strong>{{ selectedPriority }}</strong>
      </p>
    </app-demo-example>

    <app-demo-example
      title="Searchable long list"
      hint="A long option list auto-enables the search input (default threshold: 8). On mobile the same list opens as a bottom sheet."
    >
      <mn-lib-select [props]="timezoneProps"
                     class="block w-[300px] max-w-full"
                     formControlName="timezone"
      ></mn-lib-select>
      <p style="margin-top: 8px; font-size: 14px; color: gray;">
        Selected: <strong>{{ selectedTimezone }}</strong>
      </p>
    </app-demo-example>
  </form>
</app-demo-page>
