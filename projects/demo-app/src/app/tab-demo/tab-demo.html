<app-demo-page
  title="Tab"
  tag="mn-tab"
  lead="A tab bar driven by a data source, with active-state management and per-tab callbacks."
>
  <app-demo-example
    title="Basic tabs (natural width)"
    hint="Tabs take the natural width of their content with padding."
  >
    <mn-tab [dataSource]="shortTabDataSource" [scrollable]="true" (activeChange)="onTabChange($event)"></mn-tab>
  </app-demo-example>

  <app-demo-example
    title="Justified tabs"
    hint="Tabs stretch to fill the container width using [justified]=&quot;true&quot;."
  >
    <mn-tab [dataSource]="shortTabDataSource" [justified]="true" [scrollable]="true" (activeChange)="onTabChange($event)"></mn-tab>
  </app-demo-example>

  <app-demo-example
    title="Responsive scrolling"
    hint="Tabs scroll horizontally when they overflow on small screens (scrollbar hidden)."
  >
    <mn-tab [dataSource]="tabDataSource" [scrollable]="true" (activeChange)="onTabChange($event)"></mn-tab>
  </app-demo-example>

  <app-demo-example title="Active tab (log)" hint="Open the console to see tab click and change events.">
    <p class="opacity-70">Click any tab above; the active item is logged to the console.</p>
  </app-demo-example>
</app-demo-page>
